services:
  postgres:
    image: postgres:18
    container_name: payment-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-payment}
      POSTGRES_USER: ${DB_USERNAME:-payment}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-payment}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      # A partir da imagem 18, os dados ficam em /var/lib/postgresql/<versão>/docker
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
