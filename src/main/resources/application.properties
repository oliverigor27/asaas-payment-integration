spring.application.name=app

# Banco de dados (PostgreSQL do compose.yaml)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:payment}
spring.datasource.username=${DB_USERNAME:payment}
spring.datasource.password=${DB_PASSWORD:payment}

# JPA / Hibernate
# update: cria e altera as tabelas a partir das entidades (nunca apaga colunas nem tabelas)
spring.jpa.hibernate.ddl-auto=update
